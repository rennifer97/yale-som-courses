# Render Blueprint: one Web Service (backend) + one Static Site (frontend), both on the free plan.
# (Blueprints may still ask for a card; creating the two services by hand in the dashboard does not.)
# Secrets are marked sync: false, so Render asks for them in the dashboard. They never go in the repo.
services:
  - type: web
    name: som-courses-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PORTKEY_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: som-courses
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
